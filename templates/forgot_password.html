{% extends "base.html" %}

{% block title %}TradeTrack Pro | Reset Password{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-6">
  <div class="w-full max-w-md card p-6 md:p-8 shadow-xl">
    <div class="text-center mb-6">
      <div class="inline-flex p-3 rounded-full bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 text-2xl mb-2">
        🔑
      </div>
      <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Reset Password</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Enter your registered email to receive recovery instructions</p>
    </div>

    <form id="forgotForm" class="space-y-4">
      <div class="form-group">
        <label for="resetEmail" class="form-label">Email Address</label>
        <input type="email" id="resetEmail" class="form-input" placeholder="name@example.com" required>
      </div>

      <button type="submit" id="resetSubmitBtn" class="btn btn-primary w-full py-3">
        Send Reset Link
      </button>

      <div class="text-center text-xs text-gray-500 dark:text-gray-400 mt-4 pt-4 border-t border-gray-100 dark:border-gray-800">
        Remembered your password? 
        <a href="{{ url_for('index') }}" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline">Return to Login</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("forgotForm");
  if (form) {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("resetEmail").value.trim();
      if (!email) return;

      const submitBtn = document.getElementById("resetSubmitBtn");
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<div class="spinner"></div> Sending...`;

      setTimeout(() => {
        showToast("Password reset instructions sent to your email ✉️", "success");
        submitBtn.disabled = false;
        submitBtn.textContent = "Send Reset Link";
      }, 1000);
    });
  }
});
</script>
{% endblock %}
