{% extends "base.html" %}

{% block title %}TradeTrack Pro | Add Trade{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
  
  <div class="border-b border-gray-200 dark:border-gray-800 pb-4">
    <h1 id="formTitle" class="text-2xl sm:text-3xl font-bold">➕ Log New Trade</h1>
    <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-1">Record your trade parameters and emotional state for journaling.</p>
  </div>

  <!-- Live PnL Preview Banner -->
  <div class="card bg-gradient-to-r from-blue-500/10 via-indigo-500/10 to-emerald-500/10 border-blue-200 dark:border-blue-900/40 p-4">
    <div class="flex items-center justify-between">
      <div>
        <span class="text-xs font-semibold uppercase text-gray-500 dark:text-gray-400">Live Estimated PnL</span>
        <div id="pnl" class="card-value text-muted">₹0.00</div>
      </div>
      <div class="text-right">
        <span class="text-xs text-gray-400">Calculated automatically</span>
      </div>
    </div>
  </div>

  <!-- Main Form Card -->
  <form id="tradeForm" class="card p-6 space-y-5">
    
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- Stock Symbol -->
      <div class="form-group">
        <label for="stock" class="form-label">Stock / Symbol *</label>
        <input type="text" id="stock" class="form-input" placeholder="e.g. RELIANCE, NIFTY, AAPL" required>
      </div>

      <!-- Trade Type -->
      <div class="form-group">
        <label for="type" class="form-label">Trade Type *</label>
        <select id="type" class="form-select">
          <option value="BUY">BUY (Long)</option>
          <option value="SELL">SELL (Short)</option>
        </select>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <!-- Entry Price -->
      <div class="form-group">
        <label for="entry" class="form-label">Entry Price (₹) *</label>
        <input type="number" step="0.05" id="entry" class="form-input" placeholder="0.00" required>
      </div>

      <!-- Exit Price -->
      <div class="form-group">
        <label for="exit" class="form-label">Exit Price (₹) *</label>
        <input type="number" step="0.05" id="exit" class="form-input" placeholder="0.00" required>
      </div>

      <!-- Quantity -->
      <div class="form-group">
        <label for="quantity" class="form-label">Quantity / Shares *</label>
        <input type="number" id="quantity" class="form-input" placeholder="0" min="1" required>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <!-- Strategy -->
      <div class="form-group">
        <label for="strategy" class="form-label">Strategy Used</label>
        <input type="text" id="strategy" class="form-input" placeholder="e.g. Breakout, Reversal, EMA Cross">
      </div>

      <!-- Emotion -->
      <div class="form-group">
        <label for="emotion" class="form-label">Emotional State</label>
        <select id="emotion" class="form-select">
          <option value="Confident">😊 Confident</option>
          <option value="Calm">🧘 Calm / Disciplined</option>
          <option value="FOMO">⚡ FOMO / Impulsive</option>
          <option value="Fearful">Fearful / Anxious</option>
          <option value="Greedy">🤑 Greedy</option>
          <option value="Neutral" selected>😐 Neutral</option>
        </select>
      </div>

      <!-- Date -->
      <div class="form-group">
        <label for="date" class="form-label">Trade Date</label>
        <input type="date" id="date" class="form-input" required>
      </div>
    </div>

    <!-- Notes -->
    <div class="form-group">
      <label for="notes" class="form-label">Trade Notes & Lessons Learned</label>
      <textarea id="notes" class="form-textarea" rows="3" placeholder="Why did you enter this trade? Did you follow your trading plan?"></textarea>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100 dark:border-gray-800">
      <a href="{{ url_for('history') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" id="submitBtn" class="btn btn-primary min-w-[140px]">
        Save Trade Log
      </button>
    </div>

  </form>

</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/add_trade.js') }}"></script>
{% endblock %}
